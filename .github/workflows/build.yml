name: Build and test INDE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake ninja-build pkg-config \
            libgtkmm-4.0-dev libsqlite3-dev uuid-dev libicu-dev libhunspell-dev \
            libenchant-2-2 hunspell-pt-br xauth xvfb
      - name: Build the special edition
        run: sh Preparar-INDE-especial.sh
      - name: Run integration tests
        run: xvfb-run -a python3 -m unittest discover -s tests -v
