name: INDE OBJ-01 isolated model checks

on:
  push:
    branches: [feature/inde-obj-01-foundation]
    paths:
      - cpp/object_*
      - cpp/CMakeLists.txt
      - cpp/integrar_objetos.py
      - cpp/integrar_gtk.py
      - cpp/overlay/**
      - cpp/publication_service.cpp
      - cpp/service_tests.cpp
      - tests/test_obj01_native.py
      - tests/run_object_model_tests.sh
      - tests/object_model/**
      - tests/object_document/**
      - tests/object_composition/**
      - tests/object_change_plan/**
      - tests/object_change_session/**
      - tests/object_save_protocol/**
      - tests/object_checkpoint_store/**
      - tests/object_composite_pilot/**
      - tools/obj01-pilot/**
      - scripts/demos/Abrir-demo-obj01-p2a.sh
      - scripts/demos/Abrir-demo-obj01-p2b.sh
      - scripts/demos/Abrir-demo-obj01-p2c.sh
      - scripts/demos/Abrir-demo-obj01-p2d.sh
      - scripts/demos/Abrir-demo-obj01-p2d2.sh
      - scripts/demos/Abrir-demo-obj01-cartoes.sh
      - scripts/demos/Abrir-demo-obj01-hub.sh
      - scripts/demos/Abrir-demo-obj01-composicao.sh
      - scripts/demos/Abrir-demo-obj01-tabelas.sh
      - scripts/demos/Abrir-demo-obj01-estrutura-tabelas.sh
      - scripts/demos/Abrir-demo-objetos-nativos.sh
      - tests/audit_obj01_sources.py
      - tests/test_obj01_source_audit.py
      - fontes/*.tar.gz
      - metadata/BASE-INDE.json
      - metadata/INTEGRACAO-INDE.json
      - docs/arquitetura/*OBJ-01*
      - docs/validacao/*OBJ-01*
      - .github/workflows/obj-01.yml
  pull_request:
    paths:
      - cpp/object_*
      - cpp/CMakeLists.txt
      - cpp/integrar_objetos.py
      - cpp/integrar_gtk.py
      - cpp/overlay/**
      - cpp/publication_service.cpp
      - cpp/service_tests.cpp
      - tests/test_obj01_native.py
      - tests/run_object_model_tests.sh
      - tests/object_model/**
      - tests/object_document/**
      - tests/object_composition/**
      - tests/object_change_plan/**
      - tests/object_change_session/**
      - tests/object_save_protocol/**
      - tests/object_checkpoint_store/**
      - tests/object_composite_pilot/**
      - tools/obj01-pilot/**
      - scripts/demos/Abrir-demo-obj01-p2a.sh
      - scripts/demos/Abrir-demo-obj01-p2b.sh
      - scripts/demos/Abrir-demo-obj01-p2c.sh
      - scripts/demos/Abrir-demo-obj01-p2d.sh
      - scripts/demos/Abrir-demo-obj01-p2d2.sh
      - scripts/demos/Abrir-demo-obj01-cartoes.sh
      - scripts/demos/Abrir-demo-obj01-hub.sh
      - scripts/demos/Abrir-demo-obj01-composicao.sh
      - scripts/demos/Abrir-demo-obj01-tabelas.sh
      - scripts/demos/Abrir-demo-obj01-estrutura-tabelas.sh
      - scripts/demos/Abrir-demo-objetos-nativos.sh
      - tests/audit_obj01_sources.py
      - tests/test_obj01_source_audit.py
      - fontes/*.tar.gz
      - metadata/BASE-INDE.json
      - metadata/INTEGRACAO-INDE.json
      - .github/workflows/obj-01.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composite-p2a:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        compiler: [g++, clang++]
        sanitize: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install isolated document, PNG and SQLite dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libglib2.0-dev libgdk-pixbuf-2.0-dev libsqlite3-dev zlib1g-dev uuid-dev ninja-build
      - name: Extract verified owner source without migration
        run: python3 verificar_base.py --integrado --extrair
      - name: Configure P2-A without GTK or canonical SQLite repositories
        run: >-
          cmake -S tests/object_composite_pilot -B build-obj01-p2a -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DOBJ01_SANITIZE=${{ matrix.sanitize }}
          -DCMAKE_BUILD_TYPE=Debug
      - name: Compile real pilot and owner codecs
        run: cmake --build build-obj01-p2a --parallel 2
      - name: Verify all pilot profiles, table structure, retained axes, design and recovery
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-obj01-p2a --output-on-failure
  pinned-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test archive verifier refusal paths
        run: python3 -m unittest discover -s tests -p test_obj01_source_audit.py -v
      - name: Verify three archives, manifests and extracted bytes
        run: python3 tests/audit_obj01_sources.py --extract-to "$RUNNER_TEMP/obj01-sources"
  standalone-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        compiler: [g++, clang++]
        sanitize: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure isolated C++20 foundation
        run: >-
          cmake -S tests/object_model -B build-obj01 -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DOBJ01_SANITIZE=${{ matrix.sanitize }}
      - name: Compile strict C++20 foundation
        run: cmake --build build-obj01 --parallel 2
      - name: Validate invariants and transactional commands
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-obj01 --output-on-failure

  document-read-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        compiler: [g++, clang++]
        sanitize: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pure document-domain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libglib2.0-dev uuid-dev ninja-build
      - name: Extract verified schema 37 owner source
        run: python3 verificar_base.py --integrado --extrair
      - name: Configure read-only adapter and real document codecs
        run: >-
          cmake -S tests/object_document -B build-obj01-document -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DOBJ01_SANITIZE=${{ matrix.sanitize }}
      - name: Compile adapter and document-domain source
        run: cmake --build build-obj01-document --parallel 2
      - name: Verify full capture, identity, limits and freshness
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-obj01-document --output-on-failure

  composition-read-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        compiler: [g++, clang++]
        sanitize: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pure composition-domain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libglib2.0-dev uuid-dev ninja-build
      - name: Extract verified schema 37 owner source
        run: python3 verificar_base.py --integrado --extrair
      - name: Configure composition and document read adapters
        run: >-
          cmake -S tests/object_composition -B build-obj01-composition -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DOBJ01_SANITIZE=${{ matrix.sanitize }}
      - name: Compile adapters and real owner codecs
        run: cmake --build build-obj01-composition --parallel 2
      - name: Verify versions, profiles, references and private snapshots
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-obj01-composition --output-on-failure

  immutable-change-plans:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        compiler: [g++, clang++]
        sanitize: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pure owner-domain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libglib2.0-dev uuid-dev ninja-build
      - name: Extract verified schema 37 owner source
        run: python3 verificar_base.py --integrado --extrair
      - name: Configure immutable plans and real editing engine
        run: >-
          cmake -S tests/object_change_plan -B build-obj01-plan -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DOBJ01_SANITIZE=${{ matrix.sanitize }}
      - name: Compile strict change planner and owner units
        run: cmake --build build-obj01-plan --parallel 2
      - name: Verify intent, translation, refusal, freshness and undo
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-obj01-plan --output-on-failure

  reviewed-working-sessions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        compiler: [g++, clang++]
        sanitize: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pure domain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libglib2.0-dev uuid-dev ninja-build
      - name: Extract verified schema 37 owner source
        run: python3 verificar_base.py --integrado --extrair
      - name: Configure working sessions and owner replay
        run: >-
          cmake -S tests/object_checkpoint_store -B build-obj01-session -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DOBJ01_SANITIZE=${{ matrix.sanitize }}
      - name: Compile sessions and real editing units
        run: cmake --build build-obj01-session --parallel 2
      - name: Verify sessions, recovery protocol, durable generations, lease and retention
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-obj01-session --output-on-failure

  native-objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install native editor dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake ninja-build pkg-config libgtkmm-4.0-dev libwebkitgtk-6.0-dev libsqlite3-dev uuid-dev libicu-dev libhunspell-dev libenchant-2-2 hunspell-pt-br xauth xvfb
      - name: Extract verified sources
        run: python3 verificar_base.py --integrado --extrair
      - name: Configure actual INDE application
        run: cmake -S cpp -B build-nativo -G Ninja -DCMAKE_BUILD_TYPE=Release -DINDE_BUILD_CORE_TESTS=ON
      - name: Compile actual application and project-bound tests
        run: cmake --build build-nativo --target inde inde_object_native_tests inde_web_bridge inde_publication_tests --parallel 2
      - name: Verify project binding and actual GTK document workflow
        run: xvfb-run -a python3 -m unittest discover -s tests -p test_obj01_native.py -v
      - name: Verify existing publication and refusal of unsupported composition
        run: python3 -m unittest discover -s tests -p test_sessao_nativa.py -v
