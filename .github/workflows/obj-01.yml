name: INDE OBJ-01 isolated model checks

on:
  push:
    branches: [feature/inde-obj-01-foundation]
    paths:
      - cpp/object_*
      - cpp/CMakeLists.txt
      - tests/run_object_model_tests.sh
      - tests/object_model/**
      - tests/object_document/**
      - tests/object_composition/**
      - tests/object_change_plan/**
      - tests/object_change_session/**
      - tests/object_save_protocol/**
      - tests/audit_obj01_sources.py
      - tests/test_obj01_source_audit.py
      - fontes/*.tar.gz
      - metadata/BASE-INDE.json
      - metadata/INTEGRACAO-INDE.json
      - docs/arquitetura/*OBJ-01*
      - docs/validacao/*OBJ-01*
      - .github/workflows/obj-01.yml
  pull_request:
    paths:
      - cpp/object_*
      - cpp/CMakeLists.txt
      - tests/run_object_model_tests.sh
      - tests/object_model/**
      - tests/object_document/**
      - tests/object_composition/**
      - tests/object_change_plan/**
      - tests/object_change_session/**
      - tests/object_save_protocol/**
      - tests/audit_obj01_sources.py
      - tests/test_obj01_source_audit.py
      - fontes/*.tar.gz
      - metadata/BASE-INDE.json
      - metadata/INTEGRACAO-INDE.json
      - .github/workflows/obj-01.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test archive verifier refusal paths
        run: python3 -m unittest discover -s tests -p test_obj01_source_audit.py -v
      - name: Verify three archives, manifests and extracted bytes
        run: python3 tests/audit_obj01_sources.py --extract-to "$RUNNER_TEMP/obj01-sources"
  standalone-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        compiler: [g++, clang++]
        sanitize: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure isolated C++20 foundation
        run: >-
          cmake -S tests/object_model -B build-obj01 -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DOBJ01_SANITIZE=${{ matrix.sanitize }}
      - name: Compile strict C++20 foundation
        run: cmake --build build-obj01 --parallel 2
      - name: Validate invariants and transactional commands
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-obj01 --output-on-failure

  document-read-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        compiler: [g++, clang++]
        sanitize: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pure document-domain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libglib2.0-dev uuid-dev ninja-build
      - name: Extract verified schema 37 owner source
        run: python3 verificar_base.py --integrado --extrair
      - name: Configure read-only adapter and real document codecs
        run: >-
          cmake -S tests/object_document -B build-obj01-document -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DOBJ01_SANITIZE=${{ matrix.sanitize }}
      - name: Compile adapter and document-domain source
        run: cmake --build build-obj01-document --parallel 2
      - name: Verify full capture, identity, limits and freshness
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-obj01-document --output-on-failure

  composition-read-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        compiler: [g++, clang++]
        sanitize: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pure composition-domain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libglib2.0-dev uuid-dev ninja-build
      - name: Extract verified schema 37 owner source
        run: python3 verificar_base.py --integrado --extrair
      - name: Configure composition and document read adapters
        run: >-
          cmake -S tests/object_composition -B build-obj01-composition -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DOBJ01_SANITIZE=${{ matrix.sanitize }}
      - name: Compile adapters and real owner codecs
        run: cmake --build build-obj01-composition --parallel 2
      - name: Verify versions, profiles, references and private snapshots
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-obj01-composition --output-on-failure

  immutable-change-plans:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        compiler: [g++, clang++]
        sanitize: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pure owner-domain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libglib2.0-dev uuid-dev ninja-build
      - name: Extract verified schema 37 owner source
        run: python3 verificar_base.py --integrado --extrair
      - name: Configure immutable plans and real editing engine
        run: >-
          cmake -S tests/object_change_plan -B build-obj01-plan -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DOBJ01_SANITIZE=${{ matrix.sanitize }}
      - name: Compile strict change planner and owner units
        run: cmake --build build-obj01-plan --parallel 2
      - name: Verify intent, translation, refusal, freshness and undo
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-obj01-plan --output-on-failure

  reviewed-working-sessions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        compiler: [g++, clang++]
        sanitize: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pure domain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libglib2.0-dev uuid-dev ninja-build
      - name: Extract verified schema 37 owner source
        run: python3 verificar_base.py --integrado --extrair
      - name: Configure working sessions and owner replay
        run: >-
          cmake -S tests/object_save_protocol -B build-obj01-session -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DOBJ01_SANITIZE=${{ matrix.sanitize }}
      - name: Compile sessions and real editing units
        run: cmake --build build-obj01-session --parallel 2
      - name: Verify sessions, save barriers, receipts, checkpoints and recovery modes
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-obj01-session --output-on-failure
