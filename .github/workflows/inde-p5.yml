name: INDE P5 versioned project file

on:
  push:
    branches: [feature/inde-p5-single-file]
    paths:
      - cpp/project_file*
      - cpp/CMakeLists.txt
      - cpp/base_patches.json
      - cpp/integrar_project_file.py
      - cpp/integrar_gtk.py
      - cpp/main_window_project_file*.cpp
      - cpp/main_window_comic.cpp
      - cpp/main_window_smoke.hpp
      - cpp/object_usage_probe.cpp
      - cpp/object_composite_pilot.cpp
      - cpp/object_native_tests.cpp
      - cpp/object_native_ui*
      - cpp/writing_project_file.cpp
      - cpp/document_recovery_transport*
      - cpp/writing_object_integration.cpp
      - cpp/overlay/**
      - tests/project_file/**
      - scripts/demos/Abrir-demo-arquivo-unico*.sh
      - scripts/demos/Abrir-demo-confirmacao-assincrona.sh
      - scripts/demos/Abrir-demo-operacoes-arquivo.sh
      - scripts/demos/Abrir-demo-preparacao-nativa.sh
      - .github/workflows/inde-p5.yml
  pull_request:
    paths:
      - cpp/project_file*
      - cpp/CMakeLists.txt
      - cpp/base_patches.json
      - cpp/integrar_project_file.py
      - cpp/integrar_gtk.py
      - cpp/main_window_project_file*.cpp
      - cpp/main_window_comic.cpp
      - cpp/main_window_smoke.hpp
      - cpp/object_usage_probe.cpp
      - cpp/object_composite_pilot.cpp
      - cpp/object_native_tests.cpp
      - cpp/object_native_ui*
      - cpp/writing_project_file.cpp
      - cpp/document_recovery_transport*
      - cpp/writing_object_integration.cpp
      - cpp/overlay/**
      - tests/project_file/**
      - scripts/demos/Abrir-demo-arquivo-unico*.sh
      - scripts/demos/Abrir-demo-confirmacao-assincrona.sh
      - scripts/demos/Abrir-demo-operacoes-arquivo.sh
      - scripts/demos/Abrir-demo-preparacao-nativa.sh
      - .github/workflows/inde-p5.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versioned-store:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        compiler: [g++, clang++]
        sanitize: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install store dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libglib2.0-dev libsqlite3-dev locales
          sudo localedef -i pt_BR -f UTF-8 pt_BR.UTF-8
      - name: Extract and verify unchanged source
        run: python3 verificar_base.py --integrado --extrair
      - name: Configure strict native C++ store
        run: >-
          cmake -S tests/project_file -B build-p5 -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DP5_SANITIZE=${{ matrix.sanitize }} -DCMAKE_BUILD_TYPE=Debug
      - name: Compile
        run: cmake --build build-p5 --parallel 2
      - name: Test transactions, interruption, corruption, limits and transport
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          P5_REQUIRE_COMMA_LOCALE: "1"
        run: ctest --test-dir build-p5 --output-on-failure
  thread-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install store dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libglib2.0-dev libsqlite3-dev
      - name: Verify and extract pinned source
        run: python3 verificar_base.py --integrado --extrair
      - name: Build confirmation worker with ThreadSanitizer
        run: |
          cmake -S tests/project_file -B build-p5-thread -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS="-g1 -fsanitize=thread -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build-p5-thread --parallel 2 --target inde_project_file_task_tests
      - name: Verify cancellation races, exclusive ownership and teardown
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-p5-thread -R inde_project_file_task_tests --output-on-failure
  native-project:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      P5_REQUIRE_COMMA_LOCALE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install native INDE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake ninja-build pkg-config libgtkmm-4.0-dev libsqlite3-dev uuid-dev libicu-dev libhunspell-dev libenchant-2-2 hunspell-pt-br libfontconfig-dev xvfb xauth xdotool xclip xfwm4 dbus-x11 locales
          sudo localedef -i pt_BR -f UTF-8 pt_BR.UTF-8
      - name: Verify archive provenance and extract source
        run: |
          python3 tests/audit_obj01_sources.py --extract-to "$RUNNER_TEMP/p5-sources"
          python3 verificar_base.py --integrado --extrair
      - name: Build native core tests and editor
        run: |
          cmake -S cpp -B build-nativo -G Ninja -DCMAKE_BUILD_TYPE=Release -DINDE_BUILD_CORE_TESTS=ON
          cmake --build build-nativo --parallel 2 --target inde inde_recovery_transport_tests inde_object_native_tests inde_project_file_cli inde_project_file_tests inde_project_file_native_tests inde_project_file_session_tests inde_project_file_task_tests inde_project_file_benchmark
      - name: Run native P5 integration and refusal cases
        run: ctest --test-dir build-nativo -R '^(inde_project_file|inde_object_native_tests|inde_recovery_transport_tests)' --output-on-failure
      - name: Produce a real synthetic native project and versioned file
        run: build-nativo/inde_project_file_native_tests "$RUNNER_TEMP/p5-native-demo"
      - name: Open actual demo and save and quit by keyboard
        run: xvfb-run -a dbus-run-session -- python3 tests/project_file/test_native_demo.py "$RUNNER_TEMP/p5-gtk-demo"
      - name: Verify native file Save, restore, both copies, crash recovery and safe exit
        run: xvfb-run -a dbus-run-session -- python3 tests/project_file/test_native_session.py "$RUNNER_TEMP/p5b-native-session"
      - name: Exercise block format in the native lifecycle
        env:
          P5_TRANSPORT_BLOCKS: "1"
        run: xvfb-run -a dbus-run-session -- python3 tests/project_file/test_native_session.py "$RUNNER_TEMP/p5c-native-session"
      - name: Verify responsive confirmation, cancellation, queued exit and recovery
        run: xvfb-run -a dbus-run-session -- python3 tests/project_file/test_native_confirmation.py "$RUNNER_TEMP/p5d-native-confirmation"
      - name: Verify combined asynchronous open, create, copies and paginated history
        run: xvfb-run -a dbus-run-session -- python3 tests/project_file/test_native_operations.py "$RUNNER_TEMP/p5d2-native-operations"
      - name: Verify responsive native preparation and object confirmation
        run: xvfb-run -a dbus-run-session -- python3 tests/project_file/test_native_preparation.py "$RUNNER_TEMP/p5d3-native-preparation"
      - name: Measure persistent confirmation and history growth
        run: |
          mkdir -p "$RUNNER_TEMP/p5c-performance"
          build-nativo/inde_project_file_benchmark "$RUNNER_TEMP/p5c-performance/whole" 4 whole > "$RUNNER_TEMP/p5c-performance/whole.json"
          build-nativo/inde_project_file_benchmark "$RUNNER_TEMP/p5c-performance/blocks" 4 blocks > "$RUNNER_TEMP/p5c-performance/blocks.json"
          python3 - "$RUNNER_TEMP/p5c-performance" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          whole = json.loads((root/'whole.json').read_text())
          blocks = json.loads((root/'blocks.json').read_text())
          assert whole['history_and_restore_verified'] and blocks['history_and_restore_verified']
          assert blocks['new_blob_bytes'] < whole['new_blob_bytes']/8
          print('P5-C history growth and exact restoration OK')
          PY
      - name: Preserve synthetic project evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p5-native-project-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/p5-native-demo
            ${{ runner.temp }}/p5-gtk-demo
            ${{ runner.temp }}/p5b-native-session
            ${{ runner.temp }}/p5c-native-session
            ${{ runner.temp }}/p5c-performance
            ${{ runner.temp }}/p5d-native-confirmation
            ${{ runner.temp }}/p5d2-native-operations
            ${{ runner.temp }}/p5d3-native-preparation
            dados/p5-demo-*
          if-no-files-found: warn
          retention-days: 7
